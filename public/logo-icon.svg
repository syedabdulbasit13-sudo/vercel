    <!-- Inner Circle -->
    <circle cx="200" cy="138" r="16.5" fill="#dc2626" />
    <!-- Outer Circle -->
    <circle cx="200" cy="74" r="16.5" fill="#dc2626" />
    <!-- Flanking Circles -->
    <circle cx="158.8" cy="117.8" r="16.5" fill="#dc2626" />
    <circle cx="241.2" cy="117.8" r="16.5" fill="#dc2626" />
  </g>

